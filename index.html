<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>誰でも作れる簡単オムライス</title>

  <style>
    /* 全体 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: yellow;
      color: red;
      padding-bottom: 120px;
    }

    /* ヘッダー */
    header {
      background-color: yellow;
      color: red;
      text-align: center;
      padding: 30px 20px;
    }

    header h1 {
      margin: 0;
    }

    /* メイン */
    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      color: red;
    }

    section {
      margin-bottom: 40px;
    }

    section h2 {
      color: red;
      border-bottom: 2px solid red;
      padding-bottom: 10px;
    }

    /* フッター */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: yellow;
      color: red;
      text-align: center;
      padding: 20px;
    }

    footer p {
      margin: 5px 0;
    }

    footer a {
      color: red;
      margin: 0 8px;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <header>
    <h1>誰でも作れる簡単オムライス</h1>
  </header>

  <main>
    <section>
      <h2>材料</h2>
      <p>
        ①ごはん<br>
        ②たまご<br>
        ③ケチャップ<br>
        これだけ
      </p>
    </section>

    <section>
      <h2>作り方</h2>
      <p>
        ①油を敷いて温めたフライパンにごはんをいれる。一分くらいしたらケチャップを入れてごはんと混ぜる。<br>
        ②さらに移して形を作る。<br>
        ③混ぜた卵を油を敷いて温めたフライパンに入れて、焦げないくらいまで温めて、皿に移す。<br>
        ④ケチャップで好きなことを書いて完成。
      </p>
    </section>
  </main>

  <footer>
    <p>お問い合わせ：info@example.com</p>
    <p>
      <a href="https://twitter.com/" target="_blank">X (Twitter)</a>
      <a href="https://www.instagram.com/" target="_blank">Instagram</a>
      <a href="https://www.facebook.com/" target="_blank">Facebook</a>
    </p>
  </footer>

</body>
</html>
